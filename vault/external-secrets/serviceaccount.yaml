apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoplist-vault
  namespace: ytd
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shoplist-vault-token
  namespace: ytd
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["shoplist-vault"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shoplist-vault-token
  namespace: ytd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shoplist-vault-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
