apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: shoplist-vault
  namespace: ytd
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: shoplist
          serviceAccountRef:
            name: shoplist-vault
            audiences:
              - vault
