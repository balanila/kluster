apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shoplist-credentials
  namespace: ytd
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: shoplist-vault
    kind: SecretStore
  target:
    name: shoplist-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: shoplist
