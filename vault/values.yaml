global:
  tlsDisable: true
injector:
  enabled: false
server:
  image:
    repository: hashicorp/vault
    tag: "2.0.4"
  updateStrategyType: OnDelete
  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
  extraInitContainers:
    - name: data-permissions
      image: hashicorp/vault:2.0.4
      command:
        - /bin/sh
        - -ec
        - chown -R 100:1000 /vault/data && chmod 0700 /vault/data
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
          add: [CHOWN, DAC_OVERRIDE, FOWNER]
      volumeMounts:
        - name: data
          mountPath: /vault/data
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true
      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = 1
      }
      storage "file" {
        path = "/vault/data"
      }
  ha:
    enabled: false
  authDelegator:
    enabled: true
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: standard
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
ui:
  enabled: true
  serviceType: ClusterIP
