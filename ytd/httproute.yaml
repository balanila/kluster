apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: youtubedl
  namespace: ytd
spec:
  parentRefs:
    - name: ytd-gateway
      sectionName: http
  hostnames:
    - ytd.bakabuka.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: youtubedl
          port: 80
