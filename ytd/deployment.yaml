apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtubedl
  namespace: ytd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: youtubedl
  template:
    metadata:
      labels:
        app: youtubedl
    spec:
      containers:
        - name: youtubedl
          image: balanial/youtubedl:1.1.1
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
