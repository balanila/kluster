apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoplist
  namespace: ytd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shoplist
  template:
    metadata:
      labels:
        app: shoplist
    spec:
      containers:
        - name: shoplist
          image: balanial/shoplist:1.33.3
          envFrom:
            - configMapRef:
                name: shoplist-config
            - secretRef:
                name: shoplist-credentials
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
