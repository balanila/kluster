apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shoplist
  namespace: ytd
spec:
  parentRefs:
    - name: ytd-gateway
      sectionName: http
  hostnames:
    - shoplist.bakabuka.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shoplist
          port: 80
