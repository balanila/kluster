apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ytd-gateway
  namespace: ytd
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: ytd-proxy
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
